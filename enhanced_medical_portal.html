<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Office Portal - Enhanced System</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* Login Screen Styles */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 50px;
            max-width: 450px;
            width: 100%;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header .logo {
            font-size: 4em;
            margin-bottom: 15px;
        }

        .login-header h1 {
            color: #2c3e50;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #7f8c8d;
            font-size: 1em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            background: #fee;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c00;

        }

        .info-message {

            margin-bottom: 20px;
            border-left: 4px solid #1976d2;

        }

        .setup-admin {

            padding: 20px;
            margin-bottom: 25px;
        }

        .setup-admin h3 {
            color: #856404;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        /* Main Application Styles */
        .app-container {
            background: #f5f7fa;
            min-height: 100vh;
        }

        .top-nav {

        .nav-left {

        }

        .nav-right {

        .logo-section {

        }

        .user-info {

        .btn-logout {

        .dashboard-header {

        .stats-grid {

        .stat-card {

        .stat-card:hover {

        .stat-icon {

        .stat-value {

        .content-section {

        .section-header {

        .btn {

        .btn-primary {

        .btn-primary:hover {

        .btn-success {

        }

        .btn-success:hover {

        }

        .btn-danger {

        .btn-secondary {

        }

        .btn-secondary:hover {

        }

        .patient-list {
            display: grid;
            gap: 15px;
        }

        .patient-card {
            display: flex;
            align-items: center;
            gap: 20px;

        }

        .patient-card:hover {
            background: #e8f4f8;

        }

        .patient-photo {

            height: 80px;

            justify-content: center;

        }

        .patient-info {
            flex: 1;
        }

        .patient-name {
            font-size: 1.2em;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .patient-details {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .patient-details span {
            margin-right: 15px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }

        .modal-content {
            background: white;
            margin: 20px;
            padding: 40px;
            border-radius: 15px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
            position: relative;
        }

        .modal-close {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 2em;
            font-weight: bold;
            color: #95a5a6;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-close:hover {
            color: #e74c3c;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
        }

        .form-field.full-width {
            grid-column: 1 / -1;
        }

        .form-field label {
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .form-field input,
        .form-field select,
        .form-field textarea {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-field input:focus,
        .form-field select:focus,
        .form-field textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-field textarea {
            min-height: 100px;
            resize: vertical;
        }

        .photo-upload-section {
            text-align: center;
            padding: 20px;
            border: 2px dashed #e0e0e0;
            border-radius: 12px;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s;
        }

        .photo-upload-section:hover {
            border-color: #667eea;
            background: #f0f3ff;
        }

        .photo-preview {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 15px;
            border: 4px solid #667eea;
        }

        .photo-placeholder {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #ecf0f1;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            color: #7f8c8d;
        }

        .form-section {
            background: #f8f9fa;

        .form-section h2 {
            color: #2c3e50;

            padding-bottom: 10px;

        }

        .info-item {
            padding: 15px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;

        }

        .info-item label {
            display: block;

            font-size: 0.85em;

        }

        .info-item .value {

        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #ecf0f1;
        }

        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;

            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;

        }

        .tab:hover {

        }

        .prescription-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #27ae60;
            margin-bottom: 15px;
        }

        .prescription-header {
            display: flex;
            justify-content: space-between;

        }

        .prescription-medication {

        }

        .prescription-status {

        }

        .prescription-status.active {

        .prescription-status.expired {

        }

        .prescription-details {
            display: grid;

        }

        .prescription-detail {
            padding: 10px;

        .prescription-detail label {
            display: block;

        .prescription-detail .value {

        .pharmacy-card {
            background: white;
            padding: 20px;

            border-left: 4px solid #3498db;

        }

        .pharmacy-name {
            font-size: 1.2em;
            font-weight: 600;
            color: #2c3e50;

        }

        .pharmacy-details {
            color: #7f8c8d;
        }

        .pharmacy-details p {
            margin: 5px 0;

        .medical-record-item {
            background: white;

            border-radius: 12px;

        }

        .medical-record-item h4 {
            color: #2c3e50;

        .record-meta {
            color: #7f8c8d;

        .medical-record-item p {

        .notification {

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);
            const [users, setUsers] = useState([]);
            const [patients, setPatients] = useState([]);
            const [selectedPatient, setSelectedPatient] = useState(null);
            const [showPatientModal, setShowPatientModal] = useState(false);
            const [showUserModal, setShowUserModal] = useState(false);
            const [notification, setNotification] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [activeTab, setActiveTab] = useState('overview');
            const [loginForm, setLoginForm] = useState({ username: '', password: '' });
            const [setupMode, setSetupMode] = useState(false);
            const [error, setError] = useState('');

            const [newPatientForm, setNewPatientForm] = useState({
                firstName: '',
                lastName: '',
                dateOfBirth: '',
                gender: '',
                phone: '',
                email: '',
                address: '',
                emergencyContact: '',
                emergencyPhone: '',
                bloodType: '',
                allergies: '',
                currentMedications: '',
                chronicConditions: '',
                preferredPharmacy: '',
                photo: ''
            });

            const [formData, setFormData] = useState({
                chiefComplaint: '',
                diagnosis: '',
                treatment: '',
                prescription: '',
                notes: '',
                followUpDate: ''
            });

            const [prescriptionForm, setPrescriptionForm] = useState({
                medication: '',
                dosage: '',
                frequency: '',
                duration: '',
                refills: '',
                instructions: ''
            });

            const [pharmacyForm, setPharmacyForm] = useState({
                name: '',
                address: '',
                phone: '',
                fax: ''
            });

            const [newUserForm, setNewUserForm] = useState({
                username: '',
                password: '',
                name: '',
                role: 'staff'
            });

            const [appointmentForm, setAppointmentForm] = useState({
                date: '',
                time: '',
                type: '',
                reason: '',
                status: 'scheduled'
            });

            useEffect(() => {
                const storedUsers = localStorage.getItem('medicalUsers');
                const storedPatients = localStorage.getItem('patients');
                
                if (storedUsers) {
                    setUsers(JSON.parse(storedUsers));
                } else {
                    setSetupMode(true);
                }

                if (storedPatients) {
                    setPatients(JSON.parse(storedPatients));
                }
            }, []);

            const showNotification = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 3000);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const user = users.find(u => u.username === loginForm.username && u.password === loginForm.password);
                
                if (user) {
                    setCurrentUser(user);
                    setIsLoggedIn(true);
                    setError('');
                } else {
                    setError('Invalid username or password');
                }
            };

            const setupAdmin = (e) => {
                e.preventDefault();
                const adminUser = {
                    username: 'admin',
                    password: 'admin123',
                    name: 'System Administrator',
                    role: 'admin'
                };
                
                const newUsers = [adminUser];
                setUsers(newUsers);
                localStorage.setItem('medicalUsers', JSON.stringify(newUsers));
                setSetupMode(false);
                showNotification('Admin account created successfully!', 'success');
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setCurrentUser(null);
                setSelectedPatient(null);
                setLoginForm({ username: '', password: '' });
            };

            const handleInputChange = (e) => {
                setFormData({
                    ...formData,
                    [e.target.name]: e.target.value
                });
            };

            const handlePhotoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setNewPatientForm({
                            ...newPatientForm,
                            photo: reader.result
                        });
                    };
                    reader.readAsDataURL(file);
                }
            };

            const addPatient = (e) => {
                e.preventDefault();
                
                const newPatient = {
                    id: Date.now(),
                    ...newPatientForm,
                    registrationDate: new Date().toISOString(),
                    medicalRecords: [],
                    prescriptions: [],
                    pharmacies: [],
                    appointments: [],
                    medicalHistory: {
                        surgeries: [],
                        immunizations: [],
                        familyHistory: []
                    }
                };

                const updatedPatients = [...patients, newPatient];
                setPatients(updatedPatients);
                localStorage.setItem('patients', JSON.stringify(updatedPatients));
                
                setNewPatientForm({
                    firstName: '',
                    lastName: '',
                    dateOfBirth: '',
                    gender: '',
                    phone: '',
                    email: '',
                    address: '',
                    emergencyContact: '',
                    emergencyPhone: '',
                    bloodType: '',
                    allergies: '',
                    currentMedications: '',
                    chronicConditions: '',
                    preferredPharmacy: '',
                    photo: ''

                showNotification('Patient added successfully!');

                if (!formData.diagnosis && !formData.chiefComplaint) {
                    showNotification('Please enter at least a diagnosis or chief complaint', 'error');
                    return;
                }

                const record = {
                    id: Date.now(),
                    date: new Date().toISOString(),
                    recordedBy: currentUser.name,
                    ...formData
                };

                const updatedPatient = {
                    ...selectedPatient,
                    medicalRecords: [...(selectedPatient.medicalRecords || []), record]
                };

                updatePatient(updatedPatient);
                
                setFormData({
                    chiefComplaint: '',
                    diagnosis: '',
                    treatment: '',
                    prescription: '',
                    notes: '',
                    followUpDate: ''
                });

                showNotification('Medical record added successfully!');
            };

            const addPrescription = (e) => {
                e.preventDefault();
                
                const prescription = {
                    id: Date.now(),
                    ...prescriptionForm,
                    prescribedBy: currentUser.name,
                    prescribedDate: new Date().toISOString(),
                    status: 'active',
                    pharmacy: selectedPatient.preferredPharmacy || 'Not specified'
                };

                const updatedPatient = {
                    ...selectedPatient,
                    prescriptions: [...(selectedPatient.prescriptions || []), prescription]
                };

                updatePatient(updatedPatient);
                
                setPrescriptionForm({
                    medication: '',
                    dosage: '',
                    frequency: '',
                    duration: '',
                    refills: '',
                    instructions: ''
                });

                showNotification('Prescription added successfully!');
            };

            const addPharmacy = (e) => {
                e.preventDefault();
                
                const pharmacy = {
                    id: Date.now(),
                    ...pharmacyForm,
                    addedDate: new Date().toISOString()
                };

                const updatedPatient = {
                    ...selectedPatient,
                    pharmacies: [...(selectedPatient.pharmacies || []), pharmacy],
                    preferredPharmacy: pharmacy.name
                };

                updatePatient(updatedPatient);
                
                setPharmacyForm({
                    name: '',
                    address: '',
                    phone: '',
                    fax: ''
                });

                showNotification('Pharmacy added successfully!');
            };

            const addAppointment = (e) => {
                e.preventDefault();
                
                const appointment = {
                    id: Date.now(),
                    ...appointmentForm,
                    scheduledBy: currentUser.name,
                    createdDate: new Date().toISOString()
                };

                const updatedPatient = {
                    ...selectedPatient,
                    appointments: [...(selectedPatient.appointments || []), appointment]
                };

                updatePatient(updatedPatient);
                
                setAppointmentForm({
                    date: '',
                    time: '',
                    type: '',
                    reason: '',
                    status: 'scheduled'
                });

                showNotification('Appointment scheduled successfully!');
            };

            const updateAppointmentStatus = (appointmentId, newStatus) => {
                const updatedAppointments = selectedPatient.appointments.map(apt =>
                    apt.id === appointmentId ? { ...apt, status: newStatus } : apt
                );

                const updatedPatient = {
                    ...selectedPatient,
                    appointments: updatedAppointments
                };

                updatePatient(updatedPatient);
                showNotification(`Appointment ${newStatus}!`, 'info');

            const updatePatient = (updatedPatient) => {
                const updatedPatients = patients.map(p => 
                    p.id === updatedPatient.id ? updatedPatient : p

                setPatients(updatedPatients);
                setSelectedPatient(updatedPatient);
                localStorage.setItem('patients', JSON.stringify(updatedPatients));

            const deletePatient = (patientId) => {
                if (window.confirm('Are you sure you want to delete this patient? This action cannot be undone.')) {
                    const updatedPatients = patients.filter(p => p.id !== patientId);
                    setPatients(updatedPatients);
                    localStorage.setItem('patients', JSON.stringify(updatedPatients));
                    setSelectedPatient(null);

            const addNewUser = (e) => {
                e.preventDefault();
                
                if (users.find(u => u.username === newUserForm.username)) {
                    showNotification('Username already exists', 'error');

                                            <div className="form-section">
                                                <h2>Appointment Schedule</h2>
                                                {selectedPatient.appointments && selectedPatient.appointments.length > 0 ? (
                                                    selectedPatient.appointments
                                                        .slice()
                                                        .sort((a, b) => new Date(a.date + ' ' + a.time) - new Date(b.date + ' ' + b.time))
                                                        .map(appointment => {
                                                            const appointmentDateTime = new Date(appointment.date + ' ' + appointment.time);
                                                            const isPast = appointmentDateTime < new Date();
                                                            
                                                            return (
                                                                <div key={appointment.id} style={{
                                                                    background: 'white',
                                                                    padding: '20px',
                                                                    borderRadius: '12px',
                                                                    borderLeft: `4px solid ${
                                                                        appointment.status === 'completed' ? '#27ae60' :
                                                                        appointment.status === 'cancelled' ? '#e74c3c' :
                                                                        appointment.status === 'confirmed' ? '#3498db' :
                                                                        isPast ? '#95a5a6' : '#f39c12'
                                                                    }`,
                                                                    marginBottom: '15px',
                                                                    opacity: isPast && appointment.status === 'scheduled' ? 0.7 : 1
                                                                }}>
                                                                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'start', marginBottom: '15px'}}>
                                                                        <div>
                                                                            <div style={{fontSize: '1.2em', fontWeight: '600', color: '#2c3e50', marginBottom: '5px'}}>
                                                                                {appointment.type}
                                                                            </div>
                                                                            <div style={{color: '#7f8c8d', fontSize: '0.95em'}}>
                                                                                📅 {new Date(appointment.date).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}
                                                                                {' '}🕐 {appointment.time}
                                                                            </div>
                                                                        </div>
                                                                        <div style={{
                                                                            padding: '5px 12px',
                                                                            borderRadius: '20px',
                                                                            fontSize: '0.85em',
                                                                            fontWeight: '600',
                                                                            background: 
                                                                                appointment.status === 'completed' ? '#d4edda' :
                                                                                appointment.status === 'cancelled' ? '#f8d7da' :
                                                                                appointment.status === 'confirmed' ? '#d1ecf1' :
                                                                                '#fff3cd',
                                                                            color: 
                                                                                appointment.status === 'completed' ? '#155724' :
                                                                                appointment.status === 'cancelled' ? '#721c24' :
                                                                                appointment.status === 'confirmed' ? '#0c5460' :
                                                                                '#856404'
                                                                        }}>
                                                                            {appointment.status.toUpperCase()}
                                                                        </div>
                                                                    </div>
                                                                    
                                                                    <div style={{padding: '12px', background: '#f8f9fa', borderRadius: '8px', marginBottom: '15px'}}>
                                                                        <strong>Reason:</strong> {appointment.reason}
                                                                    </div>
                                                                    
                                                                    <div style={{display: 'flex', gap: '10px', flexWrap: 'wrap'}}>
                                                                        {appointment.status === 'scheduled' && (
                                                                            <>
                                                                                <button 
                                                                                    className="btn btn-primary"
                                                                                    onClick={() => updateAppointmentStatus(appointment.id, 'confirmed')}
                                                                                    style={{fontSize: '0.9em', padding: '8px 16px'}}
                                                                                >
                                                                                    ✓ Confirm
                                                                                </button>
                                                                                <button 
                                                                                    className="btn btn-danger"
                                                                                    onClick={() => updateAppointmentStatus(appointment.id, 'cancelled')}
                                                                                    style={{fontSize: '0.9em', padding: '8px 16px'}}
                                                                                >
                                                                                    ✕ Cancel
                                                                                </button>
                                                                            </>
                                                                        )}
                                                                        {appointment.status === 'confirmed' && (
                                                                            <>
                                                                                <button 
                                                                                    className="btn btn-success"
                                                                                    onClick={() => updateAppointmentStatus(appointment.id, 'completed')}
                                                                                    style={{fontSize: '0.9em', padding: '8px 16px'}}
                                                                                >
                                                                                    ✓ Mark Complete
                                                                                </button>
                                                                                <button 
                                                                                    className="btn btn-danger"
                                                                                    onClick={() => updateAppointmentStatus(appointment.id, 'cancelled')}
                                                                                    style={{fontSize: '0.9em', padding: '8px 16px'}}
                                                                                >
                                                                                    ✕ Cancel
                                                                                </button>
                                                                            </>
                                                                        )}
                                                                    </div>
                                                                    
                                                                    <div style={{marginTop: '15px', paddingTop: '15px', borderTop: '1px solid #ecf0f1', color: '#7f8c8d', fontSize: '0.85em'}}>
                                                                        Scheduled by {appointment.scheduledBy} on {new Date(appointment.createdDate).toLocaleDateString()}
                                                                    </div>
                                                                </div>
                                                            );
                                                        })
                                                ) : (
                                                    <p style={{textAlign: 'center', color: '#95a5a6', padding: '40px'}}>
                                                        No appointments scheduled
                                                    </p>
                                                )}
                                            </div>
                                        </div>
                                    )}

                                    {activeTab === 'prescriptions' && (
                                        <div>
                                            <div className="form-section">
                                                <h2>Add New Prescription</h2>
                                                <form onSubmit={addPrescription}>
                                                    <div className="form-grid">
                                                        <div className="form-field">
                                                            <label>Medication Name *</label>
                                                            <input
                                                                type="text"
                                                                value={prescriptionForm.medication}
                                                                onChange={(e) => setPrescriptionForm({...prescriptionForm, medication: e.target.value})}
                                                                required
                                                            />
                                                        </div>
                                                        <div className="form-field">
                                                            <label>Dosage *</label>
                                                            <input
                                                                type="text"
                                                                value={prescriptionForm.dosage}
                                                                onChange={(e) => setPrescriptionForm({...prescriptionForm, dosage: e.target.value})}
                                                                placeholder="e.g., 500mg"
                                                                required
                                                            />
                                                        </div>
                                                        <div className="form-field">
                                                            <label>Frequency *</label>
                                                            <input
                                                                type="text"
                                                                value={prescriptionForm.frequency}
                                                                onChange={(e) => setPrescriptionForm({...prescriptionForm, frequency: e.target.value})}
                                                                placeholder="e.g., Twice daily"
                                                                required
                                                            />
                                                        </div>
                                                        <div className="form-field">
                                                            <label>Duration</label>
                                                            <input
                                                                type="text"
                                                                value={prescriptionForm.duration}
                                                                onChange={(e) => setPrescriptionForm({...prescriptionForm, duration: e.target.value})}
                                                                placeholder="e.g., 30 days"
                                                            />
                                                        </div>
                                                        <div className="form-field">
                                                            <label>Refills</label>
                                                            <input
                                                                type="number"
                                                                value={prescriptionForm.refills}
                                                                onChange={(e) => setPrescriptionForm({...prescriptionForm, refills: e.target.value})}
                                                                min="0"
                                                            />
                                                        </div>
                                                        <div className="form-field full-width">
                                                            <label>Special Instructions</label>
                                                            <textarea
                                                                value={prescriptionForm.instructions}
                                                                onChange={(e) => setPrescriptionForm({...prescriptionForm, instructions: e.target.value})}
                                                                placeholder="e.g., Take with food"
                                                            />
                                                        </div>
                                                    </div>
                                                    <button type="submit" className="btn btn-success" style={{marginTop: '15px'}}>
                                                        ➕ Add Prescription
                                                    </button>
                                                </form>
                                            </div>

                                            <div className="form-section">
                                                <h2>Active Prescriptions</h2>
                                                {selectedPatient.prescriptions && selectedPatient.prescriptions.length > 0 ? (
                                                    selectedPatient.prescriptions.slice().reverse().map(prescription => (
                                                        <div key={prescription.id} className="prescription-card">
                                                            <div className="prescription-header">
                                                                <div className="prescription-medication">
                                                                    💊 {prescription.medication}
                                                                </div>
                                                                <div className={`prescription-status ${prescription.status}`}>
                                                                    {prescription.status.toUpperCase()}
                                                                </div>
                                                            </div>
                                                            <div className="prescription-details">
                                                                <div className="prescription-detail">
                                                                    <label>Dosage</label>
                                                                    <div className="value">{prescription.dosage}</div>
                                                                </div>
                                                                <div className="prescription-detail">
                                                                    <label>Frequency</label>
                                                                    <div className="value">{prescription.frequency}</div>
                                                                </div>
                                                                <div className="prescription-detail">
                                                                    <label>Duration</label>
                                                                    <div className="value">{prescription.duration || 'N/A'}</div>
                                                                </div>
                                                                <div className="prescription-detail">
                                                                    <label>Refills</label>
                                                                    <div className="value">{prescription.refills || '0'}</div>
                                                                </div>
                                                            </div>
                                                            {prescription.instructions && (
                                                                <div style={{marginTop: '15px', padding: '12px', background: '#f8f9fa', borderRadius: '8px'}}>
                                                                    <strong>Instructions:</strong> {prescription.instructions}
                                                                </div>
                                                            )}
                                                            <div style={{marginTop: '15px', color: '#7f8c8d', fontSize: '0.85em'}}>
                                                                Prescribed by {prescription.prescribedBy} on {new Date(prescription.prescribedDate).toLocaleDateString()}
                                                                {prescription.pharmacy && <span> • Pharmacy: {prescription.pharmacy}</span>}
                                                            </div>
                                                        </div>
                                                    ))
                                                ) : (
                                                    <p style={{textAlign: 'center', color: '#95a5a6', padding: '40px'}}>
                                                        No prescriptions on file
                                                    </p>
                                                )}
                                            </div>
                                        </div>
                                    )}

                                    {activeTab === 'pharmacy' && (
                                        <div>
                                            <div className="form-section">
                                                <h2>Add Pharmacy</h2>
                                                <form onSubmit={addPharmacy}>
                                                    <div className="form-grid">
                                                        <div className="form-field full-width">
                                                            <label>Pharmacy Name *</label>
                                                            <input
                                                                type="text"
                                                                value={pharmacyForm.name}
                                                                onChange={(e) => setPharmacyForm({...pharmacyForm, name: e.target.value})}
                                                                required
                                                            />
                                                        </div>
                                                        <div className="form-field full-width">
                                                            <label>Address *</label>
                                                            <input
                                                                type="text"
                                                                value={pharmacyForm.address}
                                                                onChange={(e) => setPharmacyForm({...pharmacyForm, address: e.target.value})}
                                                                required
                                                            />
                                                        </div>
                                                        <div className="form-field">
                                                            <label>Phone *</label>
                                                            <input
                                                                type="tel"
                                                                value={pharmacyForm.phone}
                                                                onChange={(e) => setPharmacyForm({...pharmacyForm, phone: e.target.value})}
                                                                required
                                                            />
                                                        </div>
                                                        <div className="form-field">
                                                            <label>Fax</label>
                                                            <input
                                                                type="tel"
                                                                value={pharmacyForm.fax}
                                                                onChange={(e) => setPharmacyForm({...pharmacyForm, fax: e.target.value})}
                                                            />
                                                        </div>
                                                    </div>
                                                    <button type="submit" className="btn btn-success" style={{marginTop: '15px'}}>
                                                        ➕ Add Pharmacy
                                                    </button>
                                                </form>
                                            </div>

                                            <div className="form-section">
                                                <h2>Registered Pharmacies</h2>
                                                {selectedPatient.pharmacies && selectedPatient.pharmacies.length > 0 ? (
                                                    selectedPatient.pharmacies.map(pharmacy => (
                                                        <div key={pharmacy.id} className="pharmacy-card">
                                                            <div className="pharmacy-name">
                                                                🏪 {pharmacy.name}
                                                                {selectedPatient.preferredPharmacy === pharmacy.name && (
                                                                    <span style={{marginLeft: '10px', padding: '5px 12px', background: '#d4edda', color: '#155724', borderRadius: '20px', fontSize: '0.75em', fontWeight: '600'}}>
                                                                        PREFERRED
                                                                    </span>
                                                                )}
                                                            </div>
                                                            <div className="pharmacy-details">
                                                                <p>📍 {pharmacy.address}</p>
                                                                <p>📞 Phone: {pharmacy.phone}</p>
                                                                {pharmacy.fax && <p>📠 Fax: {pharmacy.fax}</p>}
                                                            </div>
                                                        </div>
                                                    ))
                                                ) : (
                                                    <p style={{textAlign: 'center', color: '#95a5a6', padding: '40px'}}>
                                                        No pharmacies registered
                                                    </p>
                                                )}
                                            </div>
                                        </div>
                                    )}

                                    {activeTab === 'history' && (
                                        <div>
                                            <div className="form-section">
                                                <h2>Complete Medical History</h2>
                                                
                                                <div className="history-section">
                                                    <h3>🏥 Past Surgeries & Procedures</h3>
                                                    <div className="history-list">
                                                        {selectedPatient.medicalHistory?.surgeries?.length > 0 ? (
                                                            selectedPatient.medicalHistory.surgeries.map((surgery, index) => (
                                                                <div key={index} className="history-item">
                                                                    <span>{surgery.name}</span>
                                                                    <span className="date">{surgery.date}</span>
                                                                </div>
                                                            ))
                                                        ) : (
                                                            <p style={{color: '#95a5a6', padding: '20px', textAlign: 'center'}}>No surgical history recorded</p>
                                                        )}
                                                    </div>
                                                </div>

                                                <div className="history-section">
                                                    <h3>💉 Immunization Records</h3>
                                                    <div className="history-list">
                                                        {selectedPatient.medicalHistory?.immunizations?.length > 0 ? (
                                                            selectedPatient.medicalHistory.immunizations.map((vaccine, index) => (
                                                                <div key={index} className="history-item">
                                                                    <span>{vaccine.name}</span>
                                                                    <span className="date">{vaccine.date}</span>
                                                                </div>
                                                            ))
                                                        ) : (
                                                            <p style={{color: '#95a5a6', padding: '20px', textAlign: 'center'}}>No immunization records</p>
                                                        )}
                                                    </div>
                                                </div>

                                                <div className="history-section">
                                                    <h3>👨‍👩‍👧‍👦 Family Medical History</h3>
                                                    <div className="history-list">
                                                        {selectedPatient.medicalHistory?.familyHistory?.length > 0 ? (
                                                            selectedPatient.medicalHistory.familyHistory.map((history, index) => (
                                                                <div key={index} className="history-item">
                                                                    <span>{history.relation}: {history.condition}</span>
                                                                </div>
                                                            ))
                                                        ) : (
                                                            <p style={{color: '#95a5a6', padding: '20px', textAlign: 'center'}}>No family history recorded</p>
                                                        )}
                                                    </div>
                                                </div>

                                                <div className="info-item" style={{marginTop: '20px'}}>
                                                    <label>Current Chronic Conditions</label>
                                                    <div className="value">{selectedPatient.chronicConditions || 'None reported'}</div>
                                                </div>

                                                <div className="info-item">
                                                    <label>Known Allergies</label>
                                                    <div className="value" style={{color: selectedPatient.allergies ? '#e74c3c' : '#2c3e50'}}>
                                                        {selectedPatient.allergies || 'No known allergies'}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {activeTab === 'visits' && (
                                        <div>
                                            <div className="form-section">
                                                <h2>Add Visit Record</h2>
                                                <div className="form-grid">
                                                    <div className="form-field">
                                                        <label>Chief Complaint</label>
                                                        <input type="text" name="chiefComplaint" value={formData.chiefComplaint} onChange={handleInputChange} />
                                                    </div>
                                                    <div className="form-field">
                                                        <label>Follow-up Date</label>
                                                        <input type="date" name="followUpDate" value={formData.followUpDate} onChange={handleInputChange} />
                                                    </div>
                                                    <div className="form-field full-width">
                                                        <label>Diagnosis</label>
                                                        <input type="text" name="diagnosis" value={formData.diagnosis} onChange={handleInputChange} />
                                                    </div>
                                                    <div className="form-field full-width">
                                                        <label>Treatment Plan</label>
                                                        <textarea name="treatment" value={formData.treatment} onChange={handleInputChange} />
                                                    </div>
                                                    <div className="form-field full-width">
                                                        <label>Prescription Notes</label>
                                                        <textarea name="prescription" value={formData.prescription} onChange={handleInputChange} />
                                                    </div>
                                                    <div className="form-field full-width">
                                                        <label>Additional Notes</label>
                                                        <textarea name="notes" value={formData.notes} onChange={handleInputChange} />
                                                    </div>
                                                </div>
                                                <button className="btn btn-success" onClick={addMedicalRecord} style={{marginTop: '15px'}}>
                                                    ➕ Add Record
                                                </button>
                                            </div>

                                            <div className="form-section">
                                                <h2>Visit History</h2>
                                                {selectedPatient.medicalRecords && selectedPatient.medicalRecords.length > 0 ? (
                                                    selectedPatient.medicalRecords.slice().reverse().map(record => (
                                                        <div key={record.id} className="medical-record-item">
                                                            <h4>{record.diagnosis || 'General Visit'}</h4>
                                                            <div className="record-meta">
                                                                📅 {new Date(record.date).toLocaleString()} | Recorded by: {record.recordedBy}
                                                            </div>
                                                            {record.chiefComplaint && <p><strong>Chief Complaint:</strong> {record.chiefComplaint}</p>}
                                                            {record.treatment && <p><strong>Treatment:</strong> {record.treatment}</p>}
                                                            {record.prescription && <p><strong>Prescription:</strong> {record.prescription}</p>}
                                                            {record.notes && <p><strong>Notes:</strong> {record.notes}</p>}
                                                            {record.followUpDate && (
                                                                <p><strong>Follow-up:</strong> {new Date(record.followUpDate).toLocaleDateString()}</p>
                                                            )}
                                                        </div>
                                                    ))
                                                ) : (
                                                    <p style={{textAlign: 'center', color: '#95a5a6', padding: '40px'}}>
                                                        No visit records yet
                                                    </p>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* User Management Modal */}
                    <div className={`modal ${showUserModal ? 'active' : ''}`}>
                        <div className="modal-content">
                            <span className="modal-close" onClick={() => setShowUserModal(false)}>×</span>
                            <h2>👥 User Management</h2>
                            
                            <div style={{marginBottom: '30px'}}>
                                <h3 style={{marginBottom: '15px'}}>Add New User</h3>
                                <form onSubmit={addNewUser}>
                                    <div className="form-grid">
                                        <div className="form-field">
                                            <label>Username</label>
                                            <input 
                                                type="text" 
                                                value={newUserForm.username}
                                                onChange={(e) => setNewUserForm({...newUserForm, username: e.target.value})}
                                                required
                                            />
                                        </div>
                                        <div className="form-field">
                                            <label>Password</label>
                                            <input 
                                                type="password" 
                                                value={newUserForm.password}
                                                onChange={(e) => setNewUserForm({...newUserForm, password: e.target.value})}
                                                required
                                            />
                                        </div>
                                        <div className="form-field">
                                            <label>Full Name</label>
                                            <input 
                                                type="text" 
                                                value={newUserForm.name}
                                                onChange={(e) => setNewUserForm({...newUserForm, name: e.target.value})}
                                                required
                                            />
                                        </div>
                                        <div className="form-field">
                                            <label>Role</label>
                                            <select 
                                                value={newUserForm.role}
                                                onChange={(e) => setNewUserForm({...newUserForm, role: e.target.value})}
                                            >
                                                <option value="staff">Staff</option>
                                                <option value="admin">Admin</option>
                                            </select>
                                        </div>
                                    </div>
                                    <button type="submit" className="btn btn-success" style={{marginTop: '15px'}}>
                                        ➕ Add User
                                    </button>
                                </form>
                            </div>

                            <div className="user-management-list">
                                <h3 style={{marginBottom: '15px'}}>Current Users ({users.length})</h3>
                                {users.map(user => (
                                    <div key={user.username} className={`user-item ${user.role}`}>
                                        <div className="user-item-info">
                                            <h4>{user.name}</h4>
                                            <p>@{user.username} • {user.role === 'admin' ? '👑 Administrator' : '👤 Staff Member'}</p>
                                        </div>
                                        {user.username !== 'admin' && (
                                            <button 
                                                className="btn btn-danger"
                                                onClick={() => deleteUser(user.username)}
                                            >
                                                Delete
                                            </button>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {notification && (
                        <div className={`notification ${notification.type}`}>
                            {notification.message}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
